<!doctype html><body><iframe id="f" width="1000" height="800" src="about:blank"></iframe>
<script>
const f = document.getElementById('f');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const log = (m) => fetch('/__log?m=' + encodeURIComponent(m));
const doc = () => f.contentDocument;
const rows = () => doc().querySelectorAll('#public-maps tbody tr').length;
async function until(fn, ms = 8000) { const t = Date.now(); while (Date.now() - t < ms) { try { if (fn()) return true; } catch (e) {} await wait(50); } return false; }
function load(url = '/') { return new Promise((resolve) => { const h = () => { f.removeEventListener('load', h); resolve(); }; f.addEventListener('load', h); f.src = url; }); }
async function ready() { await until(() => doc().querySelector('a[data-swap-target]') && doc().readyState === 'complete'); await wait(400); }
function inject(html) { doc().body.insertAdjacentHTML('afterbegin', '<div style="position:fixed;top:60px;left:10px;z-index:5000;background:#fff;padding:4px">' + html + '</div>'); }
const el = (id) => doc().getElementById(id);
const busy = (e) => e.classList.contains('disabled') && !!e.querySelector('.ff-spinner') && e.getAttribute('aria-busy') === 'true';
const idle = (e) => !e.classList.contains('disabled') && !e.querySelector('.ff-spinner') && !e.hasAttribute('aria-busy');
const bar = () => doc().getElementById('ff-progress').classList.contains('active');
const loc = () => f.contentWindow.location.pathname + f.contentWindow.location.search;

async function s1() { // a link is loading, then "Show all" is pressed
  await load('/'); await ready();
  log('S1 initial rows=' + rows() + ' bar active=' + bar());
  inject('<a id="n" class="btn btn-secondary" href="/slow">Slow nav</a>');
  const showAll = doc().querySelector('a[data-swap-target]');
  el('n').click(); await wait(300);
  log('S1 after link click: link busy=' + busy(el('n')) + ' bar active=' + bar());
  showAll.click(); await wait(300);
  log('S1 after Show all click: link restored=' + idle(el('n')) + ' showAll busy=' + busy(showAll));
  const swapped = await until(() => rows() > 100);
  log('S1 swapped=' + swapped + ' rows=' + rows() + ' path=' + loc());
  await wait(7000);
  log('S1 after 7s (cancelled slow page must not arrive): path=' + loc());
  log('S1 bar finished=' + !bar());
}
async function s2() { // "Show all"-style swap is loading, then a link is pressed
  await load('/'); await ready();
  inject('<a id="s" class="btn btn-info" href="/slow-list" data-swap-target="public-maps">Slow swap</a> <a id="n" class="btn btn-secondary" href="/slow">Slow nav</a>');
  el('s').click(); await wait(300);
  log('S2 swap busy=' + busy(el('s')) + ' bar active=' + bar());
  el('n').click(); await wait(300);
  log('S2 after link click: swap restored=' + idle(el('s')) + ' link busy=' + busy(el('n')));
  await wait(4000);
  const d = doc();
  log('S2 aborted fragment was swapped in (must be false)=' + (!!d && !!d.getElementById('public-maps') && d.getElementById('public-maps').textContent.includes('SLOW FRAGMENT')));
  await until(() => f.contentWindow.location.pathname === '/slow', 9000);
  log('S2 final path=' + loc());
}
async function s3() { // two link navigations in a row
  await load('/'); await ready();
  inject('<a id="n1" href="/slow?x=1">One</a> <a id="n2" href="/slow?x=2">Two</a>');
  el('n1').click(); await wait(300); el('n2').click(); await wait(300);
  log('S3 first link restored=' + idle(el('n1')) + ' second busy=' + busy(el('n2')));
  await until(() => f.contentWindow.location.search === '?x=2', 9000);
  log('S3 final=' + loc());
}
async function s4() { // a form post is in flight, then a link is pressed: ignored
  await load('/'); await ready();
  inject('<form id="pf" method="post" action="/slow-post"><button id="pb" type="submit">Post</button></form><a id="n" href="/slow">Slow nav</a>');
  el('pf').requestSubmit(el('pb')); await wait(300);
  log('S4 post button busy=' + busy(el('pb')) + ' disabled=' + el('pb').disabled + ' bar active=' + bar());
  const ev = new MouseEvent('click', { bubbles: true, cancelable: true, button: 0 });
  el('n').dispatchEvent(ev);
  log('S4 link click ignored=' + ev.defaultPrevented + ' link idle=' + idle(el('n')));
  await until(() => f.contentWindow.location.pathname === '/slow-post', 9000);
  log('S4 final path=' + loc() + ' (must be /slow-post, not /slow)');
}
(async () => {
  try { await s1(); await s2(); await s3(); await s4(); } catch (e) { log('ERROR ' + e); }
  log('DONE');
})();
</script></body>
